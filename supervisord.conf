[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/tmp/supervisord.pid
user=root

[program:web]
command=gunicorn app:app -b 0.0.0.0:8000
autostart=true
autorestart=true
stdout_logfile=/app/logs/web.log
redirect_stderr=true

[program:bot]
command=python3 bot.py
autostart=true
; Previously autorestart=false + startretries=0 meant that if bot.py ever
; crashed for ANY reason (e.g. the IMDb()-at-import crash that used to kill
; it ~3s after every boot, exit status 1 in the Koyeb logs), supervisord
; would NOT restart it — the whole bot stayed dead until someone manually
; redeployed. Now it auto-restarts with backoff so a crash is a brief blip
; instead of total downtime.
autorestart=true
startretries=10
startsecs=5
stdout_logfile=/app/logs/bot.log
redirect_stderr=true
